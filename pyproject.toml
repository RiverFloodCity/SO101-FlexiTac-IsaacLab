[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "so101-flexitac-isaaclab"
version = "0.1.0"
description = "SO101, local LeFlexiTac mechanics and InnoMaker wrist RGB for Isaac Lab"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
readme = "README.md"
license-files = ["LICENSE", "licenses/*.txt", "THIRD_PARTY_NOTICES.md", "docs/source_manifest.json"]
dependencies = ["numpy>=2", "scipy", "trimesh>=4.11", "PyYAML>=6"]
[project.optional-dependencies]
sim = ["isaaclab[isaacsim]==3.0.0", "torch==2.11.0"]
test = ["pytest>=8", "manifold3d>=3.5", "pillow", "matplotlib"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
so101_flexitac = ["assets/*.json", "assets/*.yaml", "assets/*.urdf", "assets/*.xacro", "assets/assets/*.stl"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
