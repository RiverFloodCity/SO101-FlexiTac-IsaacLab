<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">SO101 platform overview</title><desc id="desc">A schematic showing the SO101 robot, wrist RGB camera and FlexiTac tactile sensor, and their simulation rates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d34"/><stop offset="1" stop-color="#1b3553"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#36c4aa"/><stop offset="1" stop-color="#6dd0f0"/></linearGradient>
  </defs>
  <rect width="1200" height="400" rx="22" fill="url(#bg)"/>
  <text x="54" y="62" fill="#f4f8fd" font-family="Arial,sans-serif" font-size="28" font-weight="700">SO101  +  FlexiTac  +  Wrist RGB</text>
  <text x="55" y="91" fill="#adc2d7" font-family="Arial,sans-serif" font-size="16">A vision-and-touch platform for contact-rich simulation</text>
  <g fill="#203955" stroke="#405a73" stroke-width="1"><rect x="54" y="120" width="340" height="202" rx="14"/><rect x="430" y="120" width="340" height="202" rx="14"/><rect x="806" y="120" width="340" height="202" rx="14"/></g>
  <g transform="translate(78 148)" fill="none" stroke="#67dbbe" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"><path d="M8 52h46M20 51V36l13-12 15 6 8-18 13 6-7 18-16 4-13-5-4 16"/><circle cx="33" cy="25" r="5"/><circle cx="52" cy="31" r="5"/><path d="M64 17l7-5M70 20l8-2"/></g>
  <g transform="translate(458 148)" fill="none" stroke="#7bd1f5" stroke-width="4" stroke-linejoin="round"><rect x="4" y="14" width="72" height="42" rx="8"/><circle cx="40" cy="35" r="12"/><path d="M15 14l5-8h18l5 8"/></g>
  <g transform="translate(834 150)" fill="none" stroke="#f3b66c" stroke-width="3"><rect x="6" y="7" width="66" height="51" rx="5"/><path d="M19 8v50M32 8v50M45 8v50M58 8v50M7 20h64M7 32h64M7 45h64"/></g>
  <g font-family="Arial,sans-serif"><text x="79" y="241" fill="#f4f8fd" font-size="21" font-weight="700">SO101 ROBOT</text><text x="79" y="273" fill="#b9cadc" font-size="16">Articulation · 6 joints</text><text x="455" y="241" fill="#f4f8fd" font-size="21" font-weight="700">WRIST CAMERA</text><text x="455" y="273" fill="#b9cadc" font-size="16">RGB · 640 × 480 · 30 Hz</text><text x="831" y="241" fill="#f4f8fd" font-size="21" font-weight="700">FLEXITAC</text><text x="831" y="273" fill="#b9cadc" font-size="16">12 × 32 taxels · 60 Hz</text></g>
  <rect x="54" y="353" width="1092" height="3" rx="2" fill="url(#accent)"/>
  <text x="55" y="382" fill="#adc2d7" font-family="Arial,sans-serif" font-size="14">ISAAC LAB 3.0  /  ISAAC SIM 6.2</text><text x="1145" y="382" fill="#adc2d7" font-family="Arial,sans-serif" font-size="14" text-anchor="end">240 Hz PHYSICS  ·  ONE ENVIRONMENT</text>
